name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install setuptools (for node-gyp)
        run: pip3 install setuptools

      - name: Install setuptools (for node-gyp)
        run: pip3 install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: |
          npm install-scripts approve electron utp-native ip-set bufferutil utf-8-validate node-datachannel || true

      - name: Rebuild native modules
        run: npm rebuild

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run build:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aki-browser-${{ matrix.os }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install setuptools (for node-gyp)
        run: pip3 install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve electron utp-native ip-set bufferutil utf-8-validate node-datachannel || true

      - name: Rebuild native modules
        run: npm rebuild

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
